# Bundle layer: inserts the Host row and its default configuration.
# The Client half is declared by package.json `dsh.client`.
- insert:
    - id: wakeword
      name: dsh-wakeword
      config:
        # Absolute path to a sherpa-onnx KWS model directory. Omit to use
        # $DSH_HOME/models/kws/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01
        # modelDir: D:/src/_models/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01
        threshold: 0.25
        numThreads: 1
        keywords:
          wake:
            - 嘿小助手
          stop:
            - 说完了
          cancel:
            - 不用了
